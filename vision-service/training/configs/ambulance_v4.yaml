# Ambulance detection, fourth experiment (S4PT-52; FR-06, UC-2.1; Vision Pipeline stage S4).
# Same data as ambulance_v3, rebalanced, at a higher resolution. In v3, 88% of the training
# images came from the street-level set and 6% from our own traffic-camera frames, and
# far ambulances on traffic cameras are only a few pixels wide at 640 px.
# 45% of the training images had no ambulance at a cap of 1,000 for special_vehicles_small_ds
# (common advice is about 10%), which pushes the model towards missing ambulances; recall
# is the weak side of v3 (0.60 at precision 0.81). The cap is 300; the images without an
# ambulance from our own Turkish frames stay, as they show the vans the model confuses.

name: ambulance_v4
seed: 42
target_classes: [ambulance]

# Roboflow Universe sources (licences checked on 12.11.2026, see README.md > Data and
# licences). "version" is the Roboflow dataset version; it must be set before
# downloading, so that the same images are used every time.
#
# class_map says what happens to each source label:
#   <target class>  the box is kept as this class
#   ignore          the box is removed, the image is kept (the label is not an ambulance)
#   drop_image      the whole image is removed, because the label may hide an ambulance
#                   and keeping the image would teach the model that it is background
# Labels not listed make prepare.py stop, so that a new label is never used unchecked.
datasets:
  - id: emergency_vehicles_detection
    workspace: smarttrafficsignal
    project: emergency_vehicles_detection
    version: 1
    licence: CC BY 4.0
    url: https://universe.roboflow.com/smarttrafficsignal/emergency_vehicles_detection
    train_repeat: 2        # traffic-camera view, small set
    # Checked 18.11.2026: "emergency" and "emergency-vehicles" mix ambulances, fire
    # engines and police cars, so their images are dropped. The test split of this
    # version has no ambulance, but its ambulance images are the only ones from a
    # traffic-camera view; 20% of them (with all their augmented copies) go to test.
    # Its train split has 3 copies of each image with random 90-degree rotations, so
    # test keeps one copy per moved image, turned upright (see prepare.upright_test_copies).
    # Most images are consecutive frames of a few videos; frames of one clip
    # (similarity >= 0.85, see prepare.assign_clips) always stay in the same split.
    augmented_copies: true
    move_to_test: 0.2
    clip_similarity: 0.85
    upright_test_copies: true
    # Copies whose upright orientation the detector got wrong, checked by eye:
    # file stem: quarter turns counter-clockwise
    orientation_overrides: {}
    class_map:
      ambulance: ambulance
      emergency: drop_image
      emergency-vehicles: drop_image

  - id: special_vehicles_small_ds
    workspace: licenseplate-e4lyg
    project: special_vehicles_small_ds
    version: 2             # 6,551 images (version 1: 6,651); checked 18.11.2026
    licence: CC BY 4.0
    url: https://universe.roboflow.com/licenseplate-e4lyg/special_vehicles_small_ds
    # About 4,000 of its 4,600 train images have no ambulance (police cars, fire engines,
    # military vehicles); 300 of them, chosen with the seed, keep teaching what is not
    # an ambulance without pushing the model towards missing ambulances.
    max_train_background: 300
    class_map:
      Ambulance: ambulance
      EMERCOM: ignore
      Fire engine: ignore
      Military: ignore
      Police car: ignore

  - id: emergency_vehicles_night
    workspace: aishwarya-s
    project: emergency_vehicles-night
    version: 27            # 147 images, no augmentation (version 28 adds rotated copies); checked 19.11.2026
    licence: CC BY 4.0
    url: https://universe.roboflow.com/aishwarya-s/emergency_vehicles-night
    train_repeat: 2
    # Night-time street scenes with emergency lights on (92 of 147 images dark), mostly
    # ambulances head-on in glare: the case ambulance_v1 missed. The labels are
    # inconsistent: checked by eye on 19.11.2026, every "Emer" and "emergency-vehicle"
    # box is an ambulance, so they map to ambulance like the five ambulance labels.
    # Frames of one clip appear in both its train and test splits, so frames are grouped
    # into clips (see prepare.assign_clips) and a clip with a test frame goes to test.
    clip_similarity: 0.85
    # Boxes that cover only part of the ambulance, checked by eye:
    exclude_images:
      02_jpg.rf.348a68fc7a22af2593f008db05c7a754: boxes on the lettering, not the vehicle
      50_18_11zon_jpg.rf.dbda1f897eff8edb720697790a17e659: box on the light bar only
      51_19_11zon_jpg.rf.847a6d9a02033789e95f53d933f3eceb: box on the light bar only
      AnyConv-com__val-5_jpg.rf.5d9e0804bdc83cde709927bb7e76348c: second box on the lettering only
      46_15_11zon_jpg.rf.dbbcabf67e07e6bf2c101b30f1cdd053: boxes on the light bars only
    class_map:
      AMBULANCE: ambulance
      Ambulance: ambulance
      ambulance_flashing: ambulance
      ambulance_on: ambulance
      ambulancias: ambulance
      Emer: ambulance
      emergency-vehicle: ambulance
      firetruck_flashing: ignore
      firetruck_on: ignore
      firetruck_off: ignore
      Firetruck-light-on: ignore
      Not Emer: ignore
      car: ignore
      rickshaw: ignore

  - id: own_cctv
    workspace: local
    project: label-studio
    version: 1
    licence: Own labels; frames of standard-licence YouTube videos, local use only, never published
    url: D:/code/atlas-data/clips (SOURCES.csv in each folder)
    # Exported with: python -m atlas_training.labelstudio export datasets/raw/own_cctv-v1
    #   --projects 1 2 --test-clip QiYlYgw7P18 --test-clip A_mp-v1pY-M --test-clip -lZjalQE3q4
    #   --test-clip FhjmqyLYuIM --test-clip PGcW-J52CXo   (19.11.2026)
    # Five Turkish videos (Ankara, Erzincan MOBESE, Adiyaman, Sivas, Usak) are the test
    # split. The export names every frame '<video>.rf.<frame>', so augmented_copies keeps
    # the frames of one video in one split.
    augmented_copies: true
    train_repeat: 4        # the target domain: Turkish traffic cameras
    class_map:
      ambulance: ambulance
      police: ignore
      fire_truck: ignore

# The held-out test set is never used for training or for choosing the best epoch.
# Each source keeps its own test split if it has one; sources without one give
# test_fraction of their images (chosen with the seed above).
split:
  test_fraction: 0.15
  val_fraction: 0.15
  # special_vehicles_small_ds has the same photos and consecutive video frames in its
  # own train and test splits (checked 18.11.2026). Test images that correlate at least
  # this much with a train or val image are removed from test.
  drop_test_near_copies: 0.95

# Pre-trained models compared with the fine-tuned one on the same test set.
pretrained:
  - id: smarttrafficai
    url: https://github.com/AmanAgrawalAI/SmartTrafficAI/raw/main/New_emergency-best.pt
    licence: Repository MIT; weights trained with Ultralytics (AGPL-3.0)
    ambulance_class: ambulance

train:
  # Continues from ambulance_v3, which already detects ambulances, instead of starting
  # from COCO; the val split is the same as v3's and the test split is never trained on.
  base_model: runs/train/ambulance_v3/weights/best.pt
  epochs: 40
  patience: 10
  imgsz: 960              # far ambulances on traffic cameras are tiny at 640
  batch: 8                 # fits an 8 GB GPU at 960 px with yolo11s
  workers: 4

evaluate:
  iou: 0.5                 # a detection counts if IoU >= 0.5 with an ambulance box
  conf: 0.25               # threshold for the reported precision and recall
