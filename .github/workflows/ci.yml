# Checks every Pull Request to main (S4PT-53): lint, tests and build of each sub-system,
# and the Docker Compose setup. Only the sub-systems whose files changed are checked;
# a change to this file or to ruff.toml checks everything.
# "CI result" is the single check that branch protection requires (see README).
# Versions are pinned (SR-16): actions by release tag, tools by the lock files and images.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changed sub-systems
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      vision: ${{ steps.filter.outputs.vision }}
      contracts: ${{ steps.filter.outputs.contracts }}
      dashboard: ${{ steps.filter.outputs.dashboard }}
      mobile: ${{ steps.filter.outputs.mobile }}
      compose: ${{ steps.filter.outputs.compose }}
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: dorny/paths-filter@v4.0.3
        id: filter
        with:
          filters: |
            ci: &ci
              - .github/workflows/ci.yml
            python: &python
              - .github/workflows/ci.yml
              - ruff.toml
            backend:
              - *python
              - backend/**
            vision:
              - *python
              - vision-service/**
            contracts:
              - *python
              - contracts/**
            dashboard:
              - *ci
              - dashboard/**
            mobile:
              - *ci
              - mobile-app/**
            compose:
              - *ci
              - compose*.yaml
              - .env.example
              - '**/Dockerfile'
              - '**/requirements.txt'
              - dashboard/package-lock.json
              - dashboard/nginx.conf

  backend:
    name: Backend (ruff, pytest)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-24.04
    container: python:3.15.2-slim
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pip install --no-cache-dir --root-user-action=ignore -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest -q

  vision-service:
    name: Vision service (ruff, pytest)
    needs: changes
    if: needs.changes.outputs.vision == 'true'
    runs-on: ubuntu-24.04
    container: python:3.15.2-slim
    defaults:
      run:
        working-directory: vision-service
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pip install --no-cache-dir --root-user-action=ignore -r requirements-dev.txt
      # training/ is excluded in ruff.toml and has its own tests and environment
      # (PyTorch, Ultralytics; see vision-service/training/README.md).
      - run: ruff check .
      - run: ruff format --check .
      - run: python -m pytest tests -q

  contracts:
    name: Contracts (schema tests)
    needs: changes
    if: needs.changes.outputs.contracts == 'true'
    runs-on: ubuntu-24.04
    container: python:3.15.2-slim
    steps:
      - uses: actions/checkout@v7.0.1
      - run: pip install --no-cache-dir --root-user-action=ignore -r contracts/requirements.txt ruff==0.17.6
      - run: ruff check contracts
      - run: ruff format --check contracts
      - run: python -m pytest contracts -q

  dashboard:
    name: Dashboard (ESLint, build)
    needs: changes
    if: needs.changes.outputs.dashboard == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: dashboard
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: 24.22.3
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  mobile-app:
    name: Mobile app (flutter analyze, flutter test)
    needs: changes
    if: needs.changes.outputs.mobile == 'true'
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: mobile-app
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: subosito/flutter-action@v2.23.0
        with:
          flutter-version: 3.50.0
          channel: stable
          cache: true
      - run: flutter pub get --enforce-lockfile
      - run: flutter analyze
      - run: flutter test

  compose:
    name: Docker Compose (config, start-up)
    needs: changes
    if: needs.changes.outputs.compose == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Check that the Compose files are valid
        run: |
          docker compose config --quiet
          docker compose -f compose.yaml -f compose.gpu.yaml config --quiet
      - name: Start all services and wait for their health checks
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: Call the health endpoints
        run: |
          curl --fail --silent --show-error http://localhost:8000/health
          curl --fail --silent --show-error http://localhost:8001/health
          curl --fail --silent --show-error http://localhost:8080/health
      - name: Show service logs
        if: failure()
        run: docker compose logs --no-color
      - name: Stop all services
        if: always()
        run: docker compose down --volumes

  result:
    name: CI result
    needs: [changes, backend, vision-service, contracts, dashboard, mobile-app, compose]
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - name: Fail if any check failed or was cancelled
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" = "failure" ] || [ "$r" = "cancelled" ]; then
              exit 1
            fi
          done
